name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight runtime + dev deps
        # We deliberately skip the `[deep]` extra (torch / torchvision) and
        # the optional `hloc` git install. The package's lazy import design
        # (PEP 562 __getattr__) means the unit-test surface — config / IO /
        # PnP / Sim(3) / output serialization — works without them.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show installed packages
        run: pip list

      - name: Run pytest
        run: pytest -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.1"
      - name: Run ruff check
        run: ruff check visual_map_localizer tests
